<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>404 — Page Not Found | Md Faijal Eaqbal Portfolio</title>
  <meta name="robots" content="noindex, follow">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles/main.css">

  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      position: relative;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 540px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .error-visual-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--accent-cyan);
      margin-bottom: 2rem;
      text-align: left;
      max-width: 480px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="error-page-wrapper">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">
      Oops! The page or resource you are looking for doesn't exist, has been removed, or was moved to a new URL.
    </p>

    <div class="error-visual-box">
      <code>
        <span style="color: #ef4444;">Error 404</span>: HTTP_NOT_FOUND<br>
        <span style="color: var(--text-muted);">// Requested URI does not exist on Md Faijal Eaqbal's portfolio server</span>
      </code>
    </div>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary btn-lg">
        <i class="fa-solid fa-house" aria-hidden="true"></i> Return to Home Page
      </a>
    </div>
  </div>

  <script>
    const storedTheme = localStorage.getItem('portfolio-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = storedTheme || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', currentTheme);
  </script>
</body>
</html>
